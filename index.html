<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Saberium</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Saberium: juego educativo de matemáticas, ciencias, sociales, humanidades y artes.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Unbounded:wght@700;900&display=swap">
<style>
/* Saberium — juego educativo. Diseño: cuadro de mando de videojuego, fondo nocturno, cada campo con su color. */
:root {
  --bg: #0d0f1e; --bg2: #13162b; --card: #1a1e3a; --card2: #232850; --line: #2f3566;
  --ink: #f1f2ff; --muted: #a6acd8; --gold: #ffc83d; --ok: #3ddc97; --bad: #ff5c7a; --brand: #8b9bff;
  --fc: #8b9bff;
  --display: 'Unbounded', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r: 16px; --fs: 1;
  color-scheme: dark;
}
:root.large { --fs: 1.18; }
:root.contrast { --line: #8c94d8; --muted: #d4d8ff; --card: #14173a; }
* { box-sizing: border-box; }
html { font-size: calc(16px * var(--fs)); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--body);
  padding-block: 0 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh; overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--bgimg, none); }
body[data-bg="aurora"] { --bgimg: radial-gradient(60% 45% at 12% 0%, rgba(76,141,255,.28), transparent 70%), radial-gradient(50% 40% at 95% 8%, rgba(46,217,138,.14), transparent 70%), radial-gradient(60% 50% at 50% 110%, rgba(169,139,255,.16), transparent 70%); }
body[data-bg="dusk"] { --bgimg: radial-gradient(60% 45% at 10% 0%, rgba(255,138,61,.26), transparent 70%), radial-gradient(55% 45% at 95% 20%, rgba(242,92,193,.2), transparent 70%), radial-gradient(60% 50% at 40% 110%, rgba(169,139,255,.18), transparent 70%); }
body[data-bg="neon"] { --bgimg: radial-gradient(50% 40% at 0% 10%, rgba(242,92,193,.3), transparent 70%), radial-gradient(50% 40% at 100% 0%, rgba(0,220,255,.22), transparent 70%), linear-gradient(180deg, transparent 60%, rgba(139,155,255,.1)); }
body[data-bg="forest"] { --bgimg: radial-gradient(60% 45% at 85% 0%, rgba(46,217,138,.26), transparent 70%), radial-gradient(60% 50% at 0% 100%, rgba(76,141,255,.14), transparent 70%); }
h1, h2, h3, p { margin: 0; }
h1:focus { outline: none; }
h1, h2, .wordmark { font-family: var(--display); font-weight: 700; text-wrap: balance; letter-spacing: -.01em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ic { width: 1.25em; height: 1.25em; flex: none; }
small { color: var(--muted); }
[hidden] { display: none !important; }

/* ---------- barra superior ---------- */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; max-width: 1040px; margin: 0 auto; padding: 10px 0; background: linear-gradient(var(--bg) 70%, transparent); }
body::after { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.brand { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px; color: var(--ink); }
.brand.sm span { font: 700 .8rem var(--display); letter-spacing: .08em; }
.brand.sm .logo-mark { width: 30px; height: 30px; }
.me { display: flex; align-items: center; gap: 10px; margin-left: auto; min-width: 0; }
.me-info { display: flex; flex-direction: column; min-width: 90px; max-width: 150px; line-height: 1.2; }
.me-info b { font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-info span { font-size: .72rem; color: var(--muted); }
.me-info .bar { height: 5px; margin-top: 3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-variant-numeric: tabular-nums; }
.chip .ic { color: var(--gold); }
.chip.coins b { color: var(--gold); }

/* ---------- avatar ---------- */
.avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(145deg, #3a4390, #232850); display: grid; place-items: center; flex: none; border: 3px solid transparent; box-shadow: 0 0 0 2px var(--line); }
.avatar .ic { width: 58%; height: 58%; }
.avatar.big { width: 64px; height: 64px; }
.frame-gold { box-shadow: 0 0 0 3px var(--gold), 0 0 14px rgba(255,200,61,.5); }
.frame-neon { box-shadow: 0 0 0 3px #00dcff, 0 0 18px rgba(0,220,255,.7), 0 0 0 6px rgba(242,92,193,.5); }
.frame-rainbow { border: 3px solid transparent; background: linear-gradient(145deg, #3a4390, #232850) padding-box, conic-gradient(#4c8dff, #2ed98a, #ff8a3d, #f25cc1, #a98bff, #4c8dff) border-box; box-shadow: none; }

/* ---------- estructura ---------- */
#app { max-width: 1040px; margin: 0 auto; padding-top: 8px; }
.screen > section { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.reduce *, .reduce *::before, .reduce *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.narrow { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
section { display: flex; flex-direction: column; gap: 16px; }
.shead { display: flex; align-items: center; gap: 12px; margin: 6px 0 4px; }
.shead h1 { font-size: clamp(1.3rem, 4.5vw, 1.9rem); line-height: 1.15; }
.shead p { color: var(--muted); font-size: .95rem; margin-top: 2px; }
.shead h1:focus { outline: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.h3 { font: 700 .8rem var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.eyebrow { font: 600 .72rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.note { color: var(--muted); font-size: .92rem; }
.empty { color: var(--muted); text-align: center; padding: 20px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.sb { justify-content: space-between; }
.row.wrap { gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.actions .btn { flex: 1 1 200px; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); font-weight: 700; transition: transform .12s, background .15s, box-shadow .15s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); background: #2c3262; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #1b1500; box-shadow: 0 4px 0 #b88a00; }
.btn.primary:hover:not(:disabled) { background: #ffd566; }
.btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 #b88a00; transform: translateY(3px); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #2a0610; }
.btn.lg { min-height: 54px; font-size: 1.05rem; padding-inline: 28px; }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: .9rem; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; box-shadow: none; }
.icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
.icon-btn.sm { width: 38px; height: 38px; }
.icon-btn:hover:not(:disabled) { background: var(--card2); }
.icon-btn:disabled { opacity: .35; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg2); font-weight: 600; font-size: .92rem; }
.chipbtn:hover { border-color: var(--fc); }
.chipbtn.on { background: var(--fc); border-color: var(--fc); color: #10122a; }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--bc, var(--fc)); transition: width .5s ease; }

/* ---------- inicio ---------- */
.hero { gap: 28px; padding-top: clamp(16px, 6vh, 56px); align-items: center; text-align: center; }
.hero-main { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.brand.big { flex-direction: column; gap: 14px; }
.logo-mark { width: 84px; height: 84px; filter: drop-shadow(0 0 22px rgba(139,155,255,.5)); animation: float 5s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px) rotate(3deg); } }
.wordmark { font-size: clamp(2.2rem, 11vw, 4.6rem); font-weight: 900; letter-spacing: .06em; line-height: 1; margin-right: -.06em; }
.tagline { max-width: 34ch; color: var(--muted); font-size: 1.15rem; }
.hero-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.worlds-strip { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; width: 100%; }
.worlds-strip li { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--fc); border-radius: var(--r); padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.worlds-strip .ic { color: var(--fc); width: 2rem; height: 2rem; }
.worlds-strip b { font-size: .92rem; }
.worlds-strip span { font-size: .75rem; color: var(--muted); }
@media (max-width: 720px) { .worlds-strip { grid-template-columns: repeat(2, 1fr); } .worlds-strip li:last-child { grid-column: 1 / -1; } }

/* ---------- perfiles ---------- */
.plist { display: flex; flex-direction: column; gap: 10px; }
.pcard { display: flex; align-items: center; gap: 8px; }
.pick { flex: 1; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; min-width: 0; }
.pick:hover { border-color: var(--brand); }
.pn { display: flex; flex-direction: column; min-width: 0; }
.pn b { overflow: hidden; text-overflow: ellipsis; }
.form label:not(.avopt) { font-weight: 600; }
input[type=text] { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg2); color: var(--ink); font: inherit; }
input[type=text]:focus { border-color: var(--gold); outline: none; }
input.right { border-color: var(--ok); } input.wrong { border-color: var(--bad); }
fieldset { border: 0; padding: 0; margin: 0; } legend { font-weight: 600; margin-bottom: 8px; }
.avchoice { display: flex; gap: 10px; flex-wrap: wrap; }
.avopt input { position: absolute; opacity: 0; }
.avopt span { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 86px; padding: 12px 6px; border: 2px solid var(--line); border-radius: 14px; background: var(--bg2); cursor: pointer; }
.avopt span .ic { width: 2rem; height: 2rem; }
.avopt input:checked + span { border-color: var(--gold); background: var(--card2); }
.avopt input:focus-visible + span { outline: 3px solid var(--gold); }
.err { color: var(--bad); font-weight: 600; }
.notice { background: rgba(255,92,122,.1); border: 1px solid var(--bad); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }

/* ---------- menú ---------- */
.welcome { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
.w-left { display: flex; align-items: center; gap: 16px; }
.w-left h1 { font-size: clamp(1.3rem, 5vw, 1.9rem); }
.w-xp { flex: 1 1 240px; display: flex; flex-direction: column; gap: 6px; }
.w-xp span { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.cta { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 18px 22px; border-radius: var(--r); border: 2px solid var(--fc); background: linear-gradient(100deg, color-mix(in srgb, var(--fc) 30%, var(--card)), var(--card)); }
.cta > .ic:first-child { width: 2.2rem; height: 2.2rem; color: var(--fc); }
.cta span { flex: 1; display: flex; flex-direction: column; }
.cta small { color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; }
.cta b { font: 700 1.1rem var(--display); }
.cta:hover { transform: translateY(-2px); }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 18px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); min-height: 128px; transition: transform .15s, border-color .15s; }
.tile:hover { transform: translateY(-3px); border-color: var(--brand); }
.tile .ic { width: 1.8rem; height: 1.8rem; color: var(--brand); margin-bottom: auto; }
.tile b { font-size: 1.02rem; } .tile small { font-size: .82rem; }
.dot { position: absolute; top: 12px; right: 12px; min-width: 24px; height: 24px; border-radius: 99px; background: var(--bad); color: #fff; font: 700 .8rem/24px var(--body); text-align: center; font-style: normal; }

/* ---------- modos y mundos ---------- */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.mcard { display: flex; flex-direction: column; gap: 8px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--fc); border-radius: var(--r); }
.mcard.locked { opacity: .7; }
.mc-ic { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px; background: color-mix(in srgb, var(--fc) 22%, transparent); color: var(--fc); }
.mcard h2 { font-size: 1.05rem; } .mcard p { color: var(--muted); font-size: .95rem; }
.mc-meta { font-size: .85rem !important; margin-top: auto; }
.mcard .btn { margin-top: 6px; }
.wlist, .fgrid { display: grid; gap: 14px; }
.fgrid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.world { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--fc); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.world.locked { opacity: .6; }
.w-head { display: flex; align-items: center; gap: 14px; }
.w-head > .ic { width: 2rem; height: 2rem; color: var(--fc); }
.w-head h2 { font-size: 1.05rem; } .w-head p { color: var(--muted); font-size: .88rem; }
.w-head .pct { margin-left: auto; font: 700 1.3rem var(--display); color: var(--fc); }
.w-lock { color: var(--muted); font-size: .9rem; }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lvl { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg2); }
.lvl:hover:not(:disabled) { border-color: var(--fc); background: var(--card2); }
.lvl:disabled { opacity: .5; }
.lv-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--fc); color: #10122a; font-weight: 800; }
.lvl:disabled .lv-n { background: var(--line); color: var(--ink); }
.stars { display: inline-flex; gap: 2px; } .st .ic { width: 1rem; height: 1rem; color: var(--line); } .st.on .ic { color: var(--gold); fill: var(--gold); }
.stars.big .st .ic { width: 2.2rem; height: 2.2rem; }
.fcard { text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 22px; background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--fc); border-radius: var(--r); transition: transform .15s; }
.fcard:hover { transform: translateY(-3px); border-color: var(--fc); }
.fcard .ic { width: 2.2rem; height: 2.2rem; color: var(--fc); }
.fcard h2 { font-size: 1.1rem; } .fcard p { color: var(--muted); } .f-meta { font-size: .82rem; color: var(--fc); font-weight: 700; margin-top: 4px; }
.brief-ic { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 18px; background: color-mix(in srgb, var(--fc) 22%, transparent); color: var(--fc); }
.brief-ic .ic { width: 2rem; height: 2rem; }
.rules { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.rules li::marker { color: var(--fc); }

/* ---------- partida ---------- */
.game { gap: 12px; max-width: 760px; margin: 0 auto; padding-top: 10px; }
.hud { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: linear-gradient(var(--bg) 75%, transparent); padding: 8px 0 12px; }
.hud-field { display: flex; align-items: center; gap: 8px; color: var(--fc); font-weight: 700; min-width: 0; }
.hud-field span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 520px) { .hud-field span { display: none; } }
.hud-stats { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.hearts { display: flex; gap: 2px; }
.heart .ic { width: 1.4rem; height: 1.4rem; color: var(--line); }
.heart.on .ic { color: var(--bad); fill: var(--bad); }
.chip.time.low { border-color: var(--bad); color: var(--bad); animation: pulse .8s infinite; }
.chip.streak .ic { color: var(--muted); } .chip.streak.hot .ic { color: #ff8a3d; fill: #ff8a3d; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.prog { height: 6px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--gold); transition: width .4s; width: 0; }
.qcard { background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--fc); border-radius: var(--r); padding: clamp(16px, 4vw, 28px); display: flex; flex-direction: column; gap: 18px; animation: rise .3s both; }
.qcard.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: color-mix(in srgb, var(--fc) 22%, transparent); color: var(--fc); letter-spacing: .02em; }
.tag.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.tag.d1 { background: rgba(61,220,151,.16); color: var(--ok); } .tag.d2 { background: rgba(255,200,61,.16); color: var(--gold); } .tag.d3 { background: rgba(255,92,122,.16); color: var(--bad); }
.tag.round { background: var(--brand); color: #10122a; }
.qtext { font-size: clamp(1.15rem, 3.6vw, 1.55rem); line-height: 1.3; font-family: var(--body); font-weight: 700; letter-spacing: 0; }
.opts { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.opts.tf { grid-template-columns: 1fr 1fr; }
@media (max-width: 560px) { .opts { grid-template-columns: 1fr; } .opts.tf { grid-template-columns: 1fr 1fr; } }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px; min-height: 58px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg2); font-weight: 600; transition: transform .1s, border-color .15s; }
.opt:hover:not(:disabled) { border-color: var(--fc); transform: translateY(-1px); }
.opt kbd { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--card2); font: 700 .8rem var(--body); color: var(--muted); }
.opt.right { border-color: var(--ok); background: rgba(61,220,151,.15); }
.opt.wrong { border-color: var(--bad); background: rgba(255,92,122,.15); }
.opt:disabled { cursor: default; color: var(--ink); }
.fillf { display: flex; gap: 10px; flex-wrap: wrap; } .fillf input { flex: 1 1 220px; }
.hint { color: var(--muted); font-size: .88rem; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 10px 0 14px; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mi { padding: 12px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg2); font-weight: 600; text-align: center; overflow-wrap: anywhere; }
.mi.sel { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,200,61,.3); }
.mi.paired { color: #10122a; border-color: transparent; }
.mi.c0 { background: #4c8dff; } .mi.c1 { background: #2ed98a; } .mi.c2 { background: #ff8a3d; } .mi.c3 { background: #f25cc1; } .mi.c4 { background: #a98bff; }
.mi:disabled { cursor: default; }

.ttl { font: 700 .85rem var(--display); color: var(--gold); min-height: 64px; display: grid; place-items: center; }

<script>
/* Saberium — contenido educativo: campos, materias y banco de preguntas */
(function (S) {
  'use strict';

  S.FIELDS = [
    { id: 'mat', name: 'Matemáticas', world: 'Nodo Numérico', color: '#4C8DFF',
      blurb: 'Cálculo, álgebra, geometría y lógica.',
      subjects: ['Operaciones', 'Fracciones y porcentajes', 'Potencias y raíces', 'Álgebra', 'Geometría', 'Funciones y sucesiones', 'Lógica'] },
    { id: 'nat', name: 'Ciencias Naturales', world: 'Laboratorio Vivo', color: '#2ED98A',
      blurb: 'Biología, física, química y medioambiente.',
      subjects: ['Biología', 'Física', 'Química', 'Medioambiente'] },
    { id: 'soc', name: 'Ciencias Sociales', world: 'Atlas del Tiempo', color: '#FF8A3D',
      blurb: 'Historia, geografía, ciudadanía y economía.',
      subjects: ['Historia de Colombia', 'Historia universal', 'Geografía', 'Ciudadanía', 'Cultura', 'Economía'] },
    { id: 'hum', name: 'Humanidades', world: 'Biblioteca Infinita', color: '#F25CC1',
      blurb: 'Lenguaje, literatura e inglés.',
      subjects: ['Lenguaje', 'Inglés'] },
    { id: 'art', name: 'Artes', world: 'Escenario Vivo', color: '#A98BFF',
      blurb: 'Música y educación física.',
      subjects: ['Música', 'Educación física'] }
  ];

  S.DIFFS = [
    { id: 1, name: 'Fácil', points: 10, coins: 1 },
    { id: 2, name: 'Intermedio', points: 20, coins: 2 },
    { id: 3, name: 'Avanzado', points: 30, coins: 3 }
  ];

  const Q = [];
  let n = 0;
  function add(f, s, d, t, o) {
    o.f = f; o.s = s; o.d = d; o.t = t; o.id = f + (++n);
    o.pts = S.DIFFS[d - 1].points;
    Q.push(o);
  }
  const mc = (f, s, d, q, opts, a, e) => add(f, s, d, 'mc', { q, o: opts, a, e });
  const tf = (f, s, d, q, a, e) => add(f, s, d, 'tf', { q, a, e });
  const fl = (f, s, d, q, a, e) => add(f, s, d, 'fill', { q, a: [].concat(a), e });
  const mt = (f, s, d, q, pairs, e) => add(f, s, d, 'match', { q, pairs, e });
  const od = (f, s, d, q, items, e) => add(f, s, d, 'order', { q, items, e });

  /* ============ MATEMÁTICAS ============ */
  mc('mat', 'Operaciones', 1, '¿Cuánto es 7 × 8?', ['54', '56', '58', '64'], 1, '7 × 8 = 56. Recuerda que 7 × 8 es 7 × 4 × 2 = 28 × 2.');
  mc('mat', 'Operaciones', 1, '¿Cuánto es 125 + 378?', ['493', '503', '513', '603'], 1, '125 + 378 = 503: 100 + 300 = 400, 25 + 78 = 103, y 400 + 103 = 503.');
  fl('mat', 'Operaciones', 1, 'Calcula mentalmente: 144 ÷ 12 = ?', ['12'], '12 × 12 = 144, por eso 144 ÷ 12 = 12.');
  mc('mat', 'Operaciones', 1, 'Cálculo mental: ¿cuánto es 15 × 4?', ['45', '55', '60', '65'], 2, '15 × 4 = (10 × 4) + (5 × 4) = 40 + 20 = 60.');
  tf('mat', 'Potencias y raíces', 1, 'La raíz cuadrada de 81 es 9.', true, '9 × 9 = 81, entonces √81 = 9.');
  mc('mat', 'Fracciones y porcentajes', 1, '¿Cuál de estas fracciones equivale a 1/2?', ['2/3', '3/6', '3/5', '1/3'], 1, '3/6 se simplifica dividiendo numerador y denominador entre 3 y resulta 1/2.');
  mc('mat', 'Fracciones y porcentajes', 2, '¿Cuánto es 3/4 + 1/4?', ['4/8', '1', '3/16', '2'], 1, 'Con el mismo denominador se suman los numeradores: 3/4 + 1/4 = 4/4 = 1.');
  fl('mat', 'Fracciones y porcentajes', 2, '¿Cuál es el 25 % de 200?', ['50'], 'El 25 % es la cuarta parte: 200 ÷ 4 = 50.');
  mc('mat', 'Fracciones y porcentajes', 2, 'Un artículo de $80.000 tiene 15 % de descuento. ¿Cuánto se paga?', ['$65.000', '$68.000', '$70.000', '$72.000'], 1, 'El 15 % de 80.000 es 12.000. Se paga 80.000 − 12.000 = $68.000.');
  mc('mat', 'Potencias y raíces', 2, '¿Cuánto es 2⁵?', ['10', '16', '25', '32'], 3, '2⁵ = 2 × 2 × 2 × 2 × 2 = 32.');
  tf('mat', 'Potencias y raíces', 2, 'Cualquier número distinto de cero elevado a la 0 es igual a 1.', true, 'Por definición a⁰ = 1 cuando a ≠ 0.');
  fl('mat', 'Potencias y raíces', 2, 'Calcula √169.', ['13'], '13 × 13 = 169.');
  fl('mat', 'Álgebra', 2, 'Si 3x + 5 = 20, ¿cuánto vale x?', ['5'], '3x = 20 − 5 = 15, y x = 15 ÷ 3 = 5.');
  mc('mat', 'Álgebra', 3, '¿Cuál es la solución de 2(x − 3) = x + 4?', ['x = 7', 'x = 10', 'x = 14', 'x = −2'], 1, '2x − 6 = x + 4, entonces x = 10.');
  fl('mat', 'Álgebra', 3, 'La ecuación x² − 5x + 6 = 0 tiene dos soluciones. ¿Cuál es la mayor?', ['3'], 'Se factoriza como (x − 2)(x − 3) = 0. Las soluciones son 2 y 3.');
  mc('mat', 'Álgebra', 3, '¿Cuál es la factorización de x² − 9?', ['(x − 3)(x − 3)', '(x − 3)(x + 3)', '(x + 9)(x − 1)', '(x − 9)(x + 1)'], 1, 'Es una diferencia de cuadrados: a² − b² = (a − b)(a + b).');
  mc('mat', 'Geometría', 1, '¿Cuál es el área de un rectángulo de 6 m de largo y 4 m de ancho?', ['10 m²', '20 m²', '24 m²', '48 m²'], 2, 'Área = base × altura = 6 × 4 = 24 m².');
  fl('mat', 'Geometría', 2, '¿Cuál es el perímetro (en cm) de un cuadrado de lado 7 cm?', ['28', '28 cm'], 'Perímetro = 4 × lado = 4 × 7 = 28 cm.');
  mc('mat', 'Geometría', 2, '¿Cuál es el volumen de un cubo de arista 3 cm?', ['9 cm³', '18 cm³', '27 cm³', '81 cm³'], 2, 'Volumen = arista³ = 3 × 3 × 3 = 27 cm³.');
  fl('mat', 'Geometría', 2, 'Un triángulo tiene base 10 cm y altura 6 cm. ¿Cuál es su área en cm²?', ['30', '30 cm2', '30 cm²'], 'Área = (base × altura) ÷ 2 = 60 ÷ 2 = 30.');
  mc('mat', 'Geometría', 3, '¿Cuál es el área de un círculo de radio 5?', ['10π', '25π', '5π', '50π'], 1, 'Área = π × r² = π × 25 = 25π.');
  mt('mat', 'Geometría', 3, 'Relaciona cada figura con su fórmula de área.', [['Cuadrado', 'l × l'], ['Rectángulo', 'b × h'], ['Triángulo', '(b × h) ÷ 2'], ['Círculo', 'π × r²']], 'Cada figura tiene una fórmula propia; el triángulo es la mitad de un rectángulo.');
  fl('mat', 'Funciones y sucesiones', 2, '¿Qué número sigue en la sucesión 3, 7, 11, 15, …?', ['19'], 'La sucesión aumenta de 4 en 4: 15 + 4 = 19.');
  mc('mat', 'Funciones y sucesiones', 2, 'Si f(x) = 2x + 1, ¿cuánto vale f(4)?', ['7', '8', '9', '10'], 2, 'f(4) = 2 × 4 + 1 = 9.');
  mc('mat', 'Funciones y sucesiones', 3, '¿Cuál es el valor del límite de (x² − 4)/(x − 2) cuando x tiende a 2?', ['0', '2', '4', 'No existe'], 2, 'Se factoriza: (x − 2)(x + 2)/(x − 2) = x + 2, que tiende a 4.');
  fl('mat', 'Funciones y sucesiones', 3, 'En una sucesión aritmética con a₁ = 5 y diferencia 3, ¿cuánto vale el término 10?', ['32'], 'aₙ = a₁ + (n − 1)d = 5 + 9 × 3 = 32.');
  od('mat', 'Lógica', 1, 'Ordena de menor a mayor estos números.', ['1/4', '0,3', '1/2', '0,75'], '1/4 = 0,25; después 0,3; luego 1/2 = 0,5 y por último 0,75.');
  fl('mat', 'Lógica', 2, 'Si 3 cuadernos cuestan $9.000, ¿cuánto cuestan 7 cuadernos? (solo el número)', ['21000'], 'Cada cuaderno cuesta $3.000. Entonces 7 × 3.000 = $21.000.');
  mc('mat', 'Lógica', 3, 'Un número aumentado en su 20 % es 60. ¿Cuál es el número?', ['40', '48', '50', '52'], 2, 'Número × 1,2 = 60, entonces número = 60 ÷ 1,2 = 50.');

  /* ============ CIENCIAS NATURALES ============ */
  mc('nat', 'Biología', 1, '¿Qué organelo produce la mayor parte de la energía (ATP) de la célula?', ['Núcleo', 'Mitocondria', 'Ribosoma', 'Vacuola'], 1, 'Las mitocondrias realizan la respiración celular y producen ATP.');
  tf('nat', 'Biología', 1, 'Las células vegetales tienen pared celular.', true, 'La pared celular de celulosa da soporte y forma a las células vegetales.');
  mc('nat', 'Biología', 1, '¿Qué órgano bombea la sangre por todo el cuerpo?', ['Pulmón', 'Hígado', 'Corazón', 'Riñón'], 2, 'El corazón es un músculo que impulsa la sangre por el sistema circulatorio.');
  od('nat', 'Biología', 1, 'Ordena esta cadena alimentaria, del productor al consumidor final.', ['Pasto', 'Saltamontes', 'Rana', 'Serpiente'], 'La energía pasa del productor (pasto) a consumidores primarios, secundarios y terciarios.');
  mc('nat', 'Biología', 2, '¿Qué molécula contiene la información genética de los seres vivos?', ['ADN', 'ATP', 'Glucosa', 'Hemoglobina'], 0, 'El ADN guarda las instrucciones para construir y hacer funcionar a un organismo.');
  mt('nat', 'Biología', 2, 'Relaciona cada sistema del cuerpo con su función.', [['Respiratorio', 'Intercambia gases'], ['Digestivo', 'Descompone alimentos'], ['Circulatorio', 'Transporta sangre'], ['Nervioso', 'Envía señales']], 'Cada sistema cumple una tarea y trabajan coordinados.');
  mc('nat', 'Biología', 2, 'En un ecosistema, los organismos que producen su propio alimento se llaman:', ['Consumidores', 'Descomponedores', 'Productores', 'Parásitos'], 2, 'Los productores, como las plantas, fabrican su alimento mediante la fotosíntesis.');
  mc('nat', 'Biología', 3, 'Dos padres Aa (A dominante, a recesivo) tienen un hijo. ¿Qué probabilidad hay de que sea aa?', ['0 %', '25 %', '50 %', '75 %'], 1, 'El cruce Aa × Aa da AA, Aa, Aa y aa: un cuarto, es decir 25 %.');
  mc('nat', 'Física', 1, '¿En qué unidad del Sistema Internacional se mide la fuerza?', ['Julio', 'Newton', 'Vatio', 'Pascal'], 1, 'La fuerza se mide en newton (N), en honor a Isaac Newton.');
  fl('nat', 'Física', 2, 'Un auto recorre 150 km en 3 horas a velocidad constante. ¿Cuál es su velocidad en km/h?', ['50', '50 km/h'], 'Velocidad = distancia ÷ tiempo = 150 ÷ 3 = 50 km/h.');
  mc('nat', 'Física', 2, '¿Cómo se llama la energía que tiene un cuerpo por estar en movimiento?', ['Potencial', 'Cinética', 'Térmica', 'Química'], 1, 'La energía cinética depende de la masa y de la velocidad del cuerpo.');
  tf('nat', 'Física', 2, 'En el vacío, un objeto pesado cae más rápido que uno liviano.', false, 'Sin resistencia del aire, todos los cuerpos caen con la misma aceleración.');
  tf('nat', 'Física', 2, 'La luz viaja más rápido que el sonido.', true, 'La luz recorre unos 300.000 km/s; el sonido en el aire, unos 340 m/s.');
  mc('nat', 'Física', 3, 'Según F = m · a, ¿qué fuerza actúa sobre una masa de 5 kg con aceleración de 4 m/s²?', ['9 N', '1,25 N', '20 N', '45 N'], 2, 'F = 5 × 4 = 20 N.');
  mc('nat', 'Física', 3, 'Según la ley de Ohm (V = I · R), ¿cuál es el voltaje si I = 2 A y R = 6 Ω?', ['3 V', '8 V', '12 V', '36 V'], 2, 'V = 2 × 6 = 12 V.');
  mc('nat', 'Química', 1, '¿Cuál es el símbolo químico del oro?', ['Or', 'Au', 'Ag', 'Go'], 1, 'Au viene del latín aurum.');
  fl('nat', 'Química', 1, '¿Cuál es el símbolo químico del sodio?', ['Na'], 'Na viene del latín natrium.');
  mc('nat', 'Química', 2, '¿Cuál es la fórmula de la sal de mesa?', ['NaCl', 'KCl', 'H₂O', 'CO₂'], 0, 'La sal de mesa es cloruro de sodio: NaCl.');
  mt('nat', 'Química', 2, 'Relaciona cada elemento con su símbolo.', [['Hierro', 'Fe'], ['Potasio', 'K'], ['Plata', 'Ag'], ['Oxígeno', 'O']], 'Algunos símbolos vienen del latín: Fe (ferrum), K (kalium), Ag (argentum).');

    el.innerHTML = `<button class="brand sm" data-act="go" data-to="menu" aria-label="Ir al menú principal">${S.logoMark()}<span>SABERIUM</span></button>
      <div class="me" title="Nivel ${li.level}">${avatar(p)}<div class="me-info"><b>${esc(p.name)}</b><span>Nivel ${li.level}</span>${bar(li.pct, 'var(--gold)')}</div></div>
      <div class="chip coins" title="Monedas">${icon('coin')}<b>${fmt(p.coins)}</b></div>`;
  }

  function render() {
    const name = current.name, fn = SCREENS[name];
    if (name !== 'game') S.game.leave();
    const p = S.store.cur();
    if (!['home', 'profiles'].includes(name) && !p) { current = { name: 'home', params: {} }; return render(); }
    if (p) { S.ensureMissions(p); }
    S.applyPrefs(); topbar();
    app().innerHTML = fn(current.params || {}, p);
    app().className = 'screen s-' + name;
    window.scrollTo(0, 0);
    const h = $('h1', app()); if (h && name !== 'game') { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    if (SCREENS[name + '_mount']) SCREENS[name + '_mount'](current.params, p);
  }
  S.nav.render = render;

  const SCREENS = {};

  /* ---------- inicio ---------- */
  SCREENS.home = () => {
    const p = S.store.cur();
    return `<section class="hero">
      <div class="hero-main">
        <div class="brand big">${S.logoMark()}<h1 class="wordmark">SABERIUM</h1></div>
        <p class="tagline">Cinco mundos, un cristal y miles de formas de demostrar lo que sabes.</p>
        <div class="hero-actions">
          ${p ? `<button class="btn primary lg" data-act="go" data-to="menu">Continuar como ${esc(p.name)}</button><button class="btn ghost lg" data-act="go" data-to="profiles">Cambiar jugador</button>`
            : `<button class="btn primary lg" data-act="go" data-to="profiles">Jugar</button>`}
          <button class="btn ghost lg" data-act="go" data-to="settings" ${p ? '' : 'data-needplayer="1"'}>Ajustes</button>
        </div>
      </div>
      <ul class="worlds-strip" aria-label="Los cinco campos">
        ${S.FIELDS.map(f => `<li style="--fc:${f.color}">${icon(f.id)}<b>${f.name}</b><span>${f.world}</span></li>`).join('')}
      </ul>
    </section>`;
  };

  /* ---------- perfiles ---------- */
  SCREENS.profiles = (params) => {
    const ps = S.store.players();
    const free = S.ITEMS.avatar.filter(a => a.price === 0);
    return `<section class="narrow">${head('¿Quién juega?', 'Elige tu perfil o crea uno nuevo. Tu progreso se guarda en este dispositivo.')}
      ${ps.length ? `<div class="plist">${ps.map(p => `<div class="pcard">
          <button class="pick" data-act="selectp" data-id="${p.id}">${avatar(p, true)}<span class="pn"><b>${esc(p.name)}</b><small>Nivel ${S.levelOf(p.xp)} · ${fmt(p.xp)} XP</small></span></button>
          <button class="icon-btn sm" data-act="delp" data-id="${p.id}" aria-label="Eliminar perfil de ${esc(p.name)}">${icon('x')}</button></div>`).join('')}</div>`
        : `<p class="empty">Aún no hay perfiles. Crea el primero para empezar a jugar.</p>`}
      ${params.del ? `<div class="notice"><p>¿Eliminar el perfil de <b>${esc(S.store.players().find(x => x.id === params.del)?.name || '')}</b>? No se puede deshacer.</p><div class="row"><button class="btn danger" data-act="delp2" data-id="${params.del}">Sí, eliminar</button><button class="btn ghost" data-act="delp0">Cancelar</button></div></div>` : ''}
      <form class="card form" data-form="newp"><h2>Nuevo perfil</h2>
        <label for="pname">Nombre del jugador</label>
        <input id="pname" name="name" type="text" maxlength="16" required minlength="2" placeholder="Por ejemplo: Camila" autocomplete="off">
        <fieldset><legend>Avatar inicial</legend><div class="avchoice">
          ${free.map((a, i) => `<label class="avopt"><input type="radio" name="av" value="${a.id}" ${i === 0 ? 'checked' : ''}><span>${icon(a.id)}<small>${a.name}</small></span></label>`).join('')}
        </div></fieldset>
        <p class="err" id="perr" role="alert" hidden></p>
        <button class="btn primary" type="submit">Crear y jugar</button>
      </form></section>`;
  };

  /* ---------- menú ---------- */
  SCREENS.menu = (_, p) => {
    const li = S.levelInfo(p.xp), na = nextAdventure(p), un = unclaimed(p);
    const tiles = [
      ['modes', 'play', 'Jugar', 'Elige un modo de juego'], ['worlds', 'map', 'Aventura', `${advDone(p)} de 15 niveles`],
      ['missions', 'gift', 'Misiones', un ? `${un} para reclamar` : 'Retos de hoy'], ['shop', 'cart', 'Tienda', 'Estilo con monedas'],
      ['progress', 'chart', 'Progreso', 'Cómo vas por materia'], ['profile', 'user', 'Perfil y logros', `${Object.keys(p.ach).length} de ${S.ACHIEVEMENTS.length} logros`],
      ['settings', 'gear', 'Ajustes', 'Sonido y accesibilidad'], ['profiles', 'swap', 'Cambiar jugador', 'Otro perfil']
    ];
    return `<section>
      <div class="welcome card"><div class="w-left">${avatar(p, true)}<div><p class="eyebrow">${esc(titleName(p))}</p><h1>Hola, ${esc(p.name)}</h1></div></div>
        <div class="w-xp"><div class="row sb"><b>Nivel ${li.level}</b><span>${fmt(li.into)} / ${fmt(li.need)} XP</span></div>${bar(li.pct, 'var(--gold)')}</div></div>
      ${na ? `<button class="cta" data-act="brief" data-mode="adventure" data-field="${na.field}" data-level="${na.level}" style="--fc:${field(na.field).color}">${icon(na.field)}<span><small>Continuar aventura</small><b>${field(na.field).world} · ${LV[na.level]}</b></span>${icon('play')}</button>
        <button class="btn ghost" data-act="go" data-to="worlds">${icon('map')} Elegir otro mundo: Ciencias, Sociales, Humanidades o Artes</button>` :
        `<button class="cta" data-act="go" data-to="modes"><span><small>Aventura completada</small><b>Prueba el Desafío final</b></span>${icon('trophy')}</button>`}
      <div class="tiles">${tiles.map(t => `<button class="tile" data-act="go" data-to="${t[0]}">${icon(t[1])}<b>${t[2]}</b><small>${t[3]}</small>${t[0] === 'missions' && un ? `<i class="dot" aria-label="${un} por reclamar">${un}</i>` : ''}</button>`).join('')}</div>
    </section>`;
  };

  /* ---------- modos ---------- */
  SCREENS.modes = (_, p) => {
    const done = advDone(p), locked = done < S.FINAL_REQ;
    return `<section>${head('Modos de juego', 'Cada modo tiene sus propias reglas y su condición de victoria.')}
      <div class="mgrid">${Object.entries(S.MODES).map(([id, m]) => {
        const lock = id === 'final' && locked, best = p.best[id];
        return `<article class="mcard ${lock ? 'locked' : ''}" style="--fc:${m.color}"><div class="mc-ic">${icon(lock ? 'lock' : m.icon)}</div>
          <h2>${m.name}</h2><p>${m.short}</p>
          <p class="mc-meta">${lock ? `Completa ${S.FINAL_REQ} niveles de Aventura (${done}/${S.FINAL_REQ})` : (best ? `Récord: ${fmt(best)} pts` : 'Aún sin récord')}</p>
          <button class="btn ${lock ? 'ghost' : 'primary'}" data-act="mode" data-mode="${id}">${lock ? 'Bloqueado' : id === 'adventure' ? 'Ver mundos' : id === 'practice' ? 'Elegir materia' : 'Ver reglas'}</button></article>`;
      }).join('')}</div></section>`;
  };

  /* ---------- aventura: mundos ---------- */
  SCREENS.worlds = (_, p) => `<section>${head('Aventura', 'Elige cualquier mundo. Dentro de cada uno, supera un nivel para abrir el siguiente.')}
    <div class="wlist">${S.FIELDS.map((f, i) => {
      const open = worldOpen(p, i), n = [0, 1, 2].filter(l => advStars(p, f.id, l) > 0).length;
      return `<article class="world ${open ? '' : 'locked'}" style="--fc:${f.color}">
        <div class="w-head">${icon(open ? f.id : 'lock')}<div><h2>${f.world}</h2><p>${f.name} · ${n}/3 niveles</p></div></div>
        ${open ? '' : `<p class="w-lock">Completa ${S.FIELDS[i - 1].world} para abrir este mundo.</p>`}
        <div class="levels">${[0, 1, 2].map(l => {
          const ok = levelOpen(p, i, l);
          return `<button class="lvl" ${ok ? `data-act="brief" data-mode="adventure" data-field="${f.id}" data-level="${l}"` : 'disabled aria-disabled="true"'}>
            <span class="lv-n">${ok ? l + 1 : icon('lock')}</span><b>${LV[l]}</b><span class="stars">${stars(advStars(p, f.id, l))}</span></button>`;
        }).join('')}</div></article>`;
    }).join('')}</div></section>`;

  /* ---------- práctica: campos y materias ---------- */
  SCREENS.fields = (_, p) => `<section>${head('Elige un campo', 'Practica la materia que quieras, sin presión.')}
    <div class="fgrid">${S.FIELDS.map(f => {
      const s = p.stats.fields[f.id], acc = s && s.a ? Math.round(s.c / s.a * 100) : null;
      return `<button class="fcard" style="--fc:${f.color}" data-act="pfield" data-field="${f.id}">${icon(f.id)}<h2>${f.name}</h2><p>${f.blurb}</p>
        <span class="f-meta">${S.QUESTIONS.filter(q => q.f === f.id).length} retos · ${acc === null ? 'sin practicar' : acc + ' % de acierto'}</span></button>`;
    }).join('')}</div></section>`;

  SCREENS.practice = (params) => {
    const f = field(params.field), subj = params.subject || '', diff = params.diff || 0;
    const avail = S.QUESTIONS.filter(q => q.f === f.id && (!subj || q.s === subj) && (!diff || q.d === diff)).length;
    return `<section class="narrow" style="--fc:${f.color}">${head('Modo práctica', f.name)}
      <div class="card">
        <h2 class="h3">Materia</h2>
        <div class="chips">${['', ...f.subjects].map(s => `<button class="chipbtn ${s === subj ? 'on' : ''}" data-act="psetup" data-subject="${esc(s)}" data-diff="${diff}" data-field="${f.id}" aria-pressed="${s === subj}">${s || 'Todas'}</button>`).join('')}</div>
        <h2 class="h3">Dificultad</h2>
        <div class="chips">${[[0, 'Todas'], [1, 'Fácil'], [2, 'Intermedio'], [3, 'Avanzado']].map(([d, n]) => `<button class="chipbtn ${d === diff ? 'on' : ''}" data-act="psetup" data-subject="${esc(subj)}" data-diff="${d}" data-field="${f.id}" aria-pressed="${d === diff}">${n}</button>`).join('')}</div>
        <p class="note">${avail ? `${avail} retos disponibles con este filtro. Jugarás hasta 10.` : 'No hay retos con esta combinación. Cambia la materia o la dificultad.'}</p>
        <button class="btn primary lg" data-act="startgame" data-mode="practice" data-field="${f.id}" data-subject="${esc(subj)}" data-diff="${diff}" ${avail ? '' : 'disabled'}>Empezar práctica</button>
      </div></section>`;
  };

  /* ---------- reglas antes de jugar ---------- */
  SCREENS.briefing = (params) => {
    const m = S.MODES[params.mode], diff = params.diff || 0, adv = params.mode === 'adventure';
    const f = adv ? field(params.field) : null;
    const choose = ['quick', 'timed', 'mixed'].includes(params.mode);
    return `<section class="narrow" style="--fc:${f ? f.color : m.color}">
      ${head(adv ? `${f.world} · ${LV[params.level]}` : m.name, adv ? f.name : m.short)}
      <div class="card"><div class="brief-ic">${icon(adv ? f.id : m.icon)}</div>
        <h2 class="h3">Reglas</h2><ul class="rules">${m.rules.map(r => `<li>${r}</li>`).join('')}</ul>
        ${choose ? `<h2 class="h3">Dificultad</h2><div class="chips">${[[0, 'Todas'], [1, 'Fácil'], [2, 'Intermedio'], [3, 'Avanzado']].map(([d, n]) => `<button class="chipbtn ${d === diff ? 'on' : ''}" data-act="bsetup" data-mode="${params.mode}" data-diff="${d}" aria-pressed="${d === diff}">${n}</button>`).join('')}</div>` : ''}
        <button class="btn primary lg" data-act="startgame" data-mode="${params.mode}" ${adv ? `data-field="${params.field}" data-level="${params.level}"` : ''} data-diff="${diff}">¡Comenzar!</button>
      </div></section>`;
  };

  /* ---------- resultados ---------- */
  SCREENS.results = (r) => {
    const m = S.MODES[r.mode], p = S.store.cur();
    const titles = { adventure: ['¡Nivel superado!', 'Nivel no superado'], quick: ['¡Desafío cumplido!', 'Fin del desafío'], practice: ['Práctica terminada', 'Práctica terminada'],
      timed: ['¡Reto superado!', 'Tiempo agotado'], mixed: ['¡Reto mixto completado!', 'Reto mixto sin terminar'], final: ['¡Campeón del Cristal!', 'Desafío final no superado'] };
    const why = r.reason === 'lives' ? 'Te quedaste sin vidas.' : r.reason === 'time' ? 'Se acabó el tiempo.' : '';
    const acc = r.total ? Math.round(r.correct / r.total * 100) : 0;
    const mm = Math.floor(r.secs / 60), ss = String(r.secs % 60).padStart(2, '0');
    const next = r.mode === 'adventure' && r.win ? nextAdventure(p) : null;
    return `<section class="results ${r.win ? 'win' : 'lose'}" style="--fc:${m.color}">
      <div class="res-hero"><div class="res-ic">${icon(r.win ? 'trophy' : 'heart')}</div><h1>${titles[r.mode][r.win ? 0 : 1]}</h1>
        ${r.mode === 'adventure' && r.win ? `<div class="stars big">${stars(r.stars)}</div>` : ''}
        <p>${why} ${r.win ? 'Buen trabajo.' : 'Cada error es una pista de qué repasar. Inténtalo de nuevo.'}${r.mode === 'timed' ? ` Meta: ${m.goal} aciertos.` : ''}</p></div>
      ${r.lvlAfter > r.lvlBefore ? `<div class="banner lvl">${icon('bolt')}<b>¡Subiste al nivel ${r.lvlAfter}!</b></div>` : ''}
      ${r.record && r.score > 0 ? `<div class="banner rec">${icon('trophy')}<b>Nuevo récord personal: ${fmt(r.score)} pts</b>${r.prevBest ? `<span>Antes: ${fmt(r.prevBest)}</span>` : ''}</div>` : ''}
      <div class="stat-grid">
        <div class="stat"><small>Puntos</small><b>${fmt(r.score)}</b></div>
        <div class="stat"><small>Experiencia</small><b>+${fmt(r.xp)}</b></div>
        <div class="stat"><small>Monedas</small><b>+${fmt(r.coins)}</b></div>
        <div class="stat"><small>Aciertos</small><b>${r.correct}/${r.total}</b></div>
        <div class="stat"><small>Precisión</small><b>${acc} %</b></div>
        <div class="stat"><small>Mejor racha</small><b>${r.maxStreak}</b></div>
        <div class="stat"><small>Tiempo</small><b>${mm}:${ss}</b></div>
        ${r.bonusCoins ? `<div class="stat"><small>Bono de victoria</small><b>+${r.bonusCoins}</b></div>` : ''}
      </div>
      ${r.fresh.length ? `<div class="card"><h2 class="h3">Logros desbloqueados</h2><ul class="achlist">${r.fresh.map(a => `<li>${icon('star')}<span><b>${esc(a.name)}</b><small>${esc(a.desc)} (+20 monedas)</small></span></li>`).join('')}</ul></div>` : ''}
      <div class="card"><h2 class="h3">Recomendaciones</h2>
        ${r.weak.length ? `<p class="note">Estos temas te costaron más. Un repaso corto ayuda:</p><div class="chips">${r.weak.map(w => `<button class="chipbtn" style="--fc:${field(w.f).color}" data-act="practicewith" data-field="${w.f}" data-subject="${esc(w.s)}">${esc(w.s)} (${w.n} ${w.n === 1 ? 'error' : 'errores'})</button>`).join('')}</div>`
          : `<p class="note">${r.total ? 'No tuviste errores en esta partida. Sube la dificultad para seguir creciendo.' : 'Responde más preguntas para recibir recomendaciones.'}</p>`}</div>
      ${r.log.length ? `<details class="card review"><summary>Revisar respuestas (${r.log.length})</summary><ol>${r.log.map(l => `<li class="${l.ok ? 'ok' : 'bad'}">${icon(l.ok ? 'check' : 'x')}<span><b>${esc(l.q.q)}</b><small>${esc(l.q.e)}</small></span></li>`).join('')}</ol></details>` : ''}
      <div class="actions">
        ${next ? `<button class="btn primary lg" data-act="brief" data-mode="adventure" data-field="${next.field}" data-level="${next.level}">Siguiente nivel</button>` : ''}
        <button class="btn ${next ? 'ghost' : 'primary'} lg" data-act="again">Jugar de nuevo</button>
        <button class="btn ghost lg" data-act="go" data-to="menu" data-reset="1">Menú principal</button>
      </div></section>`;
  };
  SCREENS.results_mount = (r) => {
    if (r.win) S.confetti(r.mode === 'final' ? 220 : 110);
    if (r.lvlAfter > r.lvlBefore) setTimeout(() => S.confetti(90), 700);
  };

  SCREENS.game = () => S.game.render();

  /* ---------- perfil ---------- */
  SCREENS.profile = (_, p) => {
    const li = S.levelInfo(p.xp), st = p.stats, acc = st.answered ? Math.round(st.correct / st.answered * 100) : 0;
    return `<section>${head('Perfil')}
      <div class="card pfhead">${avatar(p, true)}<div><p class="eyebrow">${esc(titleName(p))}</p><h2>${esc(p.name)}</h2>
        <div class="row sb"><b>Nivel ${li.level}</b><span>${fmt(p.xp)} XP en total</span></div>${bar(li.pct, 'var(--gold)')}<small>Faltan ${fmt(li.need - li.into)} XP para el nivel ${li.level + 1}</small></div></div>
      <div class="stat-grid">
        <div class="stat"><small>Partidas</small><b>${st.games}</b></div><div class="stat"><small>Respuestas correctas</small><b>${st.correct}</b></div>
        <div class="stat"><small>Precisión</small><b>${st.answered ? acc + ' %' : '—'}</b></div><div class="stat"><small>Mejor racha</small><b>${st.bestStreak}</b></div>
        <div class="stat"><small>Monedas</small><b>${fmt(p.coins)}</b></div><div class="stat"><small>Niveles de Aventura</small><b>${advDone(p)}/15</b></div></div>
      <div class="card"><h2 class="h3">Récords personales</h2>${Object.keys(p.best).length ? `<ul class="records">${Object.entries(S.MODES).filter(([id]) => p.best[id]).map(([id, m]) => `<li>${icon(m.icon)}<span>${m.name}</span><b>${fmt(p.best[id])} pts</b></li>`).join('')}</ul>` : '<p class="note">Todavía no tienes récords. Termina una partida para registrar el primero.</p>'}</div>
      <div class="card"><h2 class="h3">Logros (${Object.keys(p.ach).length}/${S.ACHIEVEMENTS.length})</h2>
        <ul class="achgrid">${S.ACHIEVEMENTS.map(a => { const got = p.ach[a.id]; return `<li class="${got ? 'got' : ''}" ${a.medal && got ? `style="--fc:${a.medal}"` : ''}>${icon(got ? 'star' : 'lock')}<span><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></span></li>`; }).join('')}</ul></div></section>`;
  };

  /* ---------- misiones ---------- */
  SCREENS.missions = (_, p) => {
    const ms = S.ensureMissions(p), all = ms.list.every(m => m.claimed);
    return `<section class="narrow">${head('Misiones diarias', 'Se renuevan cada día. Reclama tus recompensas al completarlas.')}
      <div class="mlist">${ms.list.map((m, i) => {
        const d = S.missionDef(m.id), done = m.progress >= d.goal, pr = Math.min(m.progress, d.goal);
        return `<article class="mission ${m.claimed ? 'claimed' : ''}"><div class="m-top"><h2>${d.text}</h2><span class="reward">+${d.coins} ${icon('coin')} · +${d.xp} XP</span></div>
          ${bar(pr / d.goal * 100, 'var(--ok)')}<div class="row sb"><small>${pr} / ${d.goal}</small>
          <button class="btn ${done && !m.claimed ? 'primary' : 'ghost'} sm" data-act="claim" data-i="${i}" ${done && !m.claimed ? '' : 'disabled'}>${m.claimed ? 'Reclamada' : done ? 'Reclamar' : 'En curso'}</button></div></article>`;
      }).join('')}</div>
      <article class="mission bonus ${ms.bonus ? 'claimed' : ''}"><div class="m-top"><h2>Bono del día</h2><span class="reward">+30 ${icon('coin')} · +60 XP</span></div>
        <p class="note">Reclama las tres misiones para abrir este premio extra.</p>
        <button class="btn ${all && !ms.bonus ? 'primary' : 'ghost'} sm" data-act="claimbonus" ${all && !ms.bonus ? '' : 'disabled'}>${ms.bonus ? 'Reclamado' : all ? 'Reclamar bono' : 'Bloqueado'}</button></article>
      <div class="actions"><button class="btn primary" data-act="go" data-to="modes">Ir a jugar</button></div></section>`;
  };

  /* ---------- tienda ---------- */
  SCREENS.shop = (params, p) => {
    const cat = params.cat || 'avatar';
    return `<section>${head('Tienda', 'Gasta tus monedas en objetos de estilo. No cambian tu puntaje.')}
      <div class="row sb wrap"><div class="tabs" role="tablist">${Object.entries(S.ITEM_CATS).map(([k, n]) => `<button role="tab" aria-selected="${k === cat}" class="tab ${k === cat ? 'on' : ''}" data-act="shoptab" data-cat="${k}">${n}</button>`).join('')}</div>
        <div class="chip coins">${icon('coin')}<b>${fmt(p.coins)}</b></div></div>
      <div class="igrid">${S.ITEMS[cat].map(it => {
        const own = p.owned[cat].includes(it.id), eq = p.equipped[cat] === it.id, can = p.coins >= it.price;
        let prev = '';
        if (cat === 'avatar') prev = `<span class="avatar big frame-none">${icon(it.id)}</span>`;
        else if (cat === 'frame') prev = `<span class="avatar big frame-${it.id}">${icon(p.equipped.avatar)}</span>`;
        else if (cat === 'bg') prev = `<span class="bgprev" data-bg="${it.id}"></span>`;
        else prev = `<span class="ttl">${esc(it.name)}</span>`;
        return `<article class="item ${eq ? 'eq' : ''}">${prev}<h2>${esc(it.name)}</h2>
          ${own ? `<button class="btn ${eq ? 'ghost' : 'primary'} sm" data-act="equip" data-cat="${cat}" data-id="${it.id}" ${eq ? 'disabled' : ''}>${eq ? 'Equipado' : 'Equipar'}</button>`
            : `<button class="btn ${can ? 'primary' : 'ghost'} sm" data-act="buy" data-cat="${cat}" data-id="${it.id}" ${can ? '' : 'disabled'}>${icon('coin')} ${it.price}${can ? '' : ' · faltan ' + (it.price - p.coins)}</button>`}</article>`;
      }).join('')}</div></section>`;
  };

  /* ---------- progreso académico ---------- */
  SCREENS.progress = (_, p) => {
    const st = p.stats;
    if (!st.answered) return `<section class="narrow">${head('Progreso académico')}<div class="card empty-card">${icon('chart')}<h2>Aún no hay datos</h2><p>Responde algunas preguntas y aquí verás tu precisión en cada campo y materia.</p><button class="btn primary" data-act="go" data-to="modes">Jugar ahora</button></div></section>`;
    const subs = [];
    S.FIELDS.forEach(f => f.subjects.forEach(s => { const x = st.subjects[f.id + '|' + s] || { a: 0, c: 0 }; subs.push({ f: f.id, s, a: x.a, c: x.c, acc: x.a ? x.c / x.a : null }); }));
    const weak = subs.filter(x => x.a >= 3 && x.acc < 0.7).sort((a, b) => a.acc - b.acc).slice(0, 3);
    const fresh = subs.filter(x => x.a < 3).sort((a, b) => a.a - b.a).slice(0, 3);
    const recs = weak.length ? weak : fresh;
    return `<section>${head('Progreso académico', `${st.correct} aciertos de ${st.answered} respuestas (${Math.round(st.correct / st.answered * 100)} %)`)}
      <div class="card"><h2 class="h3">${weak.length ? 'Te conviene repasar' : 'Para explorar'}</h2><div class="chips">${recs.map(x => `<button class="chipbtn" style="--fc:${field(x.f).color}" data-act="practicewith" data-field="${x.f}" data-subject="${esc(x.s)}">${esc(x.s)}${x.a ? ' · ' + Math.round(x.acc * 100) + ' %' : ' · sin practicar'}</button>`).join('')}</div></div>
      <div class="pgrid">${S.FIELDS.map(f => {
        const s = st.fields[f.id] || { a: 0, c: 0 }, pct = s.a ? Math.round(s.c / s.a * 100) : 0;
        return `<article class="pcardf" style="--fc:${f.color}"><div class="w-head">${icon(f.id)}<div><h2>${f.name}</h2><p>${s.a ? `${s.c} de ${s.a} correctas` : 'Sin practicar'}</p></div><b class="pct">${s.a ? pct + ' %' : '—'}</b></div>
          ${bar(pct)}<ul class="subs">${f.subjects.map(sn => { const x = st.subjects[f.id + '|' + sn] || { a: 0, c: 0 }, pp = x.a ? Math.round(x.c / x.a * 100) : 0; return `<li><span>${sn}</span><div>${bar(pp)}</div><small>${x.a ? pp + ' %' : '—'}</small></li>`; }).join('')}</ul></article>`;
      }).join('')}</div></section>`;
  };

  /* ---------- ajustes ---------- */
  SCREENS.settings = (params) => {
    const s = S.store.settings();
    const sw = (k, label, desc) => `<label class="switch"><input type="checkbox" data-set="${k}" ${s[k] ? 'checked' : ''}><span class="track"></span><span class="sl"><b>${label}</b><small>${desc}</small></span></label>`;
    return `<section class="narrow">${head('Ajustes')}
      <div class="card"><h2 class="h3">Sonido</h2>
        ${sw('sfx', 'Efectos de sonido', 'Aciertos, errores, logros y subidas de nivel.')}
        ${sw('music', 'Música de fondo', 'Una melodía suave mientras juegas.')}
        <label class="range" for="vol"><b>Volumen</b><input id="vol" type="range" min="0" max="1" step="0.05" value="${s.vol}" data-setr="vol"></label>
        <button class="btn ghost sm" data-act="testsound">Probar sonido</button></div>
      <div class="card"><h2 class="h3">Accesibilidad</h2>
        ${sw('reduce', 'Reducir animaciones', 'Desactiva confeti, sacudidas y movimientos.')}
        ${sw('large', 'Texto grande', 'Aumenta el tamaño de la letra en todo el juego.')}
        ${sw('contrast', 'Alto contraste', 'Bordes y textos más marcados.')}
        <p class="note">Puedes jugar con el teclado: números 1 a 4 para elegir, V y F en verdadero o falso, Esc para pausar.</p></div>
      <div class="card"><h2 class="h3">Datos</h2>
        ${S.store.cur() ? (params.confirm === 'reset' ? `<div class="notice"><p>Se borrará todo el progreso de <b>${esc(S.store.cur().name)}</b>. Los demás perfiles no cambian.</p><div class="row"><button class="btn danger" data-act="reset2">Sí, reiniciar</button><button class="btn ghost" data-act="cfg0">Cancelar</button></div></div>` : `<button class="btn ghost" data-act="cfg" data-c="reset">Reiniciar mi progreso</button>`) : ''}
        ${params.confirm === 'wipe' ? `<div class="notice"><p>Se borrarán todos los perfiles y ajustes de este dispositivo.</p><div class="row"><button class="btn danger" data-act="wipe2">Sí, borrar todo</button><button class="btn ghost" data-act="cfg0">Cancelar</button></div></div>` : `<button class="btn ghost" data-act="cfg" data-c="wipe">Borrar todos los datos</button>`}
      </div></section>`;
  };

  /* ---------- acciones ---------- */
  const cfgFrom = d => {
    const c = { mode: d.mode, diff: +d.diff || 0 };
    if (d.field) c.field = d.field; if (d.level !== undefined) c.level = +d.level; if (d.subject) c.subject = d.subject;
    return c;
  };
  let lastCfg = null;
  const ACT = S.actions = {
    go(el) { if (el.dataset.needplayer) { S.toast('Primero crea o elige un perfil.'); return S.nav.go('profiles'); } S.nav.go(el.dataset.to, {}, el.dataset.reset ? { reset: true } : {}); },
    back() { S.nav.back(); },
    selectp(el) { S.store.select(el.dataset.id); S.audio.play('click'); S.nav.go('menu', {}, { reset: true }); },
    delp(el) { S.nav.go('profiles', { del: el.dataset.id }, { replace: true }); },
    delp0() { S.nav.go('profiles', {}, { replace: true }); },
    delp2(el) { S.store.remove(el.dataset.id); S.nav.go('profiles', {}, { replace: true }); },
    mode(el) {
      const m = el.dataset.mode, p = S.store.cur();
      if (m === 'adventure') return S.nav.go('worlds');
      if (m === 'practice') return S.nav.go('fields');
      if (m === 'final' && advDone(p) < S.FINAL_REQ) { S.toast(`Completa ${S.FINAL_REQ} niveles de Aventura para abrir el Desafío final.`); return; }
      S.nav.go('briefing', { mode: m });
    },
    brief(el) { S.nav.go('briefing', { mode: el.dataset.mode, field: el.dataset.field, level: +el.dataset.level }); },
    bsetup(el) { S.nav.go('briefing', { mode: el.dataset.mode, diff: +el.dataset.diff }, { replace: true }); },
    pfield(el) { S.nav.go('practice', { field: el.dataset.field }); },
    psetup(el) { S.nav.go('practice', { field: el.dataset.field, subject: el.dataset.subject, diff: +el.dataset.diff }, { replace: true }); },
    practicewith(el) { S.nav.go('practice', { field: el.dataset.field, subject: el.dataset.subject }); },
    startgame(el) { lastCfg = cfgFrom(el.dataset); S.game.start(lastCfg); },
    again() { const r = current.params; if (r && r.cfg) { lastCfg = r.cfg; S.game.start(lastCfg); } else S.nav.go('modes', {}, { reset: true }); },
    claim(el) {
      const p = S.store.cur(); const d = S.missionDef(S.ensureMissions(p).list[+el.dataset.i].id);
      if (S.claimMission(p, +el.dataset.i)) { S.toast(`<b>Misión reclamada</b><span>+${d.coins} monedas · +${d.xp} XP</span>`); S.confetti(30, innerWidth / 2, innerHeight / 3); render(); }
    },
    claimbonus() { const p = S.store.cur(); if (S.claimBonus(p)) { S.toast('<b>Bono del día reclamado</b><span>+30 monedas · +60 XP</span>'); S.confetti(60); render(); } },
    shoptab(el) { S.nav.go('shop', { cat: el.dataset.cat }, { replace: true }); },
    buy(el) {
      const p = S.store.cur(), cat = el.dataset.cat, it = S.ITEMS[cat].find(x => x.id === el.dataset.id);
      if (!it || p.owned[cat].includes(it.id)) return;
      if (p.coins < it.price) { S.toast('Te faltan monedas para este objeto.'); return; }
      p.coins -= it.price; p.owned[cat].push(it.id); p.equipped[cat] = it.id; p.counters.bought++;
      S.audio.play('coin'); S.checkAchievements(p); S.store.save();
      S.toast(`<b>Comprado y equipado</b><span>${esc(it.name)}</span>`); render();
    },
    equip(el) { const p = S.store.cur(); const cat = el.dataset.cat; if (p.owned[cat].includes(el.dataset.id)) { p.equipped[cat] = el.dataset.id; S.store.save(); S.audio.play('click'); render(); } },
    testsound() { S.audio.play('ok'); },
    cfg(el) { S.nav.go('settings', { confirm: el.dataset.c }, { replace: true }); },
    cfg0() { S.nav.go('settings', {}, { replace: true }); },
    reset2() { const p = S.store.cur(); S.store.reset(p.id); S.toast('Progreso reiniciado.'); S.nav.go('menu', {}, { reset: true }); },
    wipe2() { S.store.wipe(); S.audio.music(false); S.nav.go('home', {}, { reset: true }); }
  };

  S.onSubmit = function (form, e) {
    if (form.dataset.form === 'newp') {
      e.preventDefault();
      const name = form.elements.name.value.trim(), err = $('#perr');
      if (name.length < 2) { err.hidden = false; err.textContent = 'Escribe un nombre de al menos 2 letras.'; return; }
      if (S.store.players().some(p => p.name.toLowerCase() === name.toLowerCase())) { err.hidden = false; err.textContent = 'Ya existe un perfil con ese nombre. Elige otro.'; return; }
      S.store.create(name, form.elements.av.value); S.audio.play('done'); S.nav.go('menu', {}, { reset: true });
    }
  };
})(window.S);

/* Saberium — arranque y eventos globales */
(function (S) {
  'use strict';
  const { $ } = S;
  const CLICK_SFX = new Set(['go', 'back', 'mode', 'brief', 'bsetup', 'pfield', 'psetup', 'startgame', 'shoptab', 'equip', 'pause', 'resume', 'next', 'again', 'practicewith']);

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const act = el.dataset.act, fn = (S.game.actions && S.game.actions[act]) || S.actions[act];
    if (!fn) return;
    S.audio.init();
    if (S.store.settings().music && !S.audio.musicOn) S.audio.music(true);
    if (CLICK_SFX.has(act)) S.audio.play('click');
    fn(el, e);
  });

  document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (f) S.onSubmit(f, e); });

  document.addEventListener('change', e => {
    const t = e.target, s = S.store.settings();
    if (t.dataset && t.dataset.set) {
      s[t.dataset.set] = t.checked; S.store.save(); S.applyPrefs();
      if (t.dataset.set === 'music') { S.audio.init(); S.audio.music(t.checked); }
      if (t.dataset.set === 'sfx' && t.checked) S.audio.play('ok');
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset && t.dataset.setr) { S.store.settings()[t.dataset.setr] = +t.value; S.audio.setVol(); S.store.save(); }
  });

  document.addEventListener('keydown', e => S.game.key(e));
  document.addEventListener('visibilitychange', () => { if (document.hidden) S.game.pauseIfActive(); });
  window.addEventListener('resize', () => { const c = $('#fx'); if (c) { c.width = innerWidth; c.height = innerHeight; } });

  S.applyPrefs();
  S.nav.go('home', {}, { reset: true });
})(window.S);

</script>
</body></html>
